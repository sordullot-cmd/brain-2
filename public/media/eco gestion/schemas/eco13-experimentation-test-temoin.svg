<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="L experimentation : groupe test et groupe temoin, et les trois types d experiences">
  <title>Groupe test / groupe témoin, et les trois types d'expériences</title>
  <rect width="960" height="452" fill="#ffffff"/>

  <style>
    .t   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .box { font-size: 15.5px; font-weight: 700; }
    .sub { font-size: 12px; fill: #46506b; }
    .key { font-size: 13.5px; font-weight: 700; fill: #12203f; }
    .note{ font-size: 12.5px; fill: #8a93a8; }
  </style>

  <text class="t cap" x="30" y="36">§ 5 · 1) l'expérimentation — vérifier qu'une cause a bien l'effet supposé</text>

  <defs>
    <marker id="fe4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.45"/>
    </marker>
  </defs>

  <g>
    <rect x="24" y="74" width="196" height="70" rx="13" fill="#12203f" fill-opacity="0.06" stroke="#12203f" stroke-opacity="0.3"/>
    <text class="t box" x="122" y="104" text-anchor="middle">Une population</text>
    <text class="t sub" x="122" y="127" text-anchor="middle">de même composition</text>
  </g>

  <path d="M226 109 C 254 109, 254 74, 282 74" stroke="#12203f" stroke-opacity="0.4" stroke-width="2" fill="none" marker-end="url(#fe4)"/>
  <path d="M226 109 C 254 109, 254 174, 282 174" stroke="#12203f" stroke-opacity="0.4" stroke-width="2" fill="none" marker-end="url(#fe4)"/>

  <g>
    <rect x="290" y="46" width="300" height="58" rx="13" fill="#2f7d4f" fill-opacity="0.14" stroke="#2f7d4f" stroke-opacity="0.5"/>
    <text class="t box" x="312" y="70">Groupe test</text>
    <text class="t sub" x="312" y="90">reçoit le « traitement » — la cause étudiée</text>
  </g>

  <g>
    <rect x="290" y="146" width="300" height="58" rx="13" fill="#c2761a" fill-opacity="0.14" stroke="#c2761a" stroke-opacity="0.5"/>
    <text class="t box" x="312" y="170">Groupe témoin</text>
    <text class="t sub" x="312" y="190">ne le reçoit pas — tout le reste identique</text>
  </g>

  <path d="M596 75 C 626 75, 626 125, 656 125" stroke="#12203f" stroke-opacity="0.4" stroke-width="2" fill="none" marker-end="url(#fe4)"/>
  <path d="M596 175 C 626 175, 626 125, 656 125" stroke="#12203f" stroke-opacity="0.4" stroke-width="2" fill="none" marker-end="url(#fe4)"/>

  <g>
    <rect x="664" y="76" width="272" height="98" rx="13" fill="#1f6f9c" fill-opacity="0.13" stroke="#1f6f9c" stroke-opacity="0.5"/>
    <text class="t box" x="686" y="106">On compare les résultats</text>
    <text class="t sub" x="686" y="130">une seule cause varie</text>
    <text class="t key" x="686" y="154">→ observation TCEPA</text>
  </g>

  <rect x="24" y="226" width="912" height="46" rx="13" fill="#d92d5e" fill-opacity="0.07" stroke="#d92d5e" stroke-opacity="0.4"/>
  <text class="t key" x="46" y="255">L'expérience doit être <tspan style="font-size:15.5px">reproductible</tspan> pour être scientifique</text>

  <text class="t key" x="30" y="308">Trois types d'expériences, un même principe</text>

  <g>
    <rect x="24" y="322" width="292" height="106" rx="13" fill="#12203f" fill-opacity="0.06" stroke="#12203f" stroke-opacity="0.3"/>
    <text class="t box" x="46" y="350">En laboratoire</text>
    <text class="t sub" x="46" y="374">expériences contrôlées</text>
  </g>

  <g>
    <rect x="334" y="322" width="292" height="106" rx="13" fill="#12203f" fill-opacity="0.06" stroke="#12203f" stroke-opacity="0.3"/>
    <text class="t box" x="356" y="350">Naturelles</text>
    <text class="t sub" x="356" y="374">l'assignation au groupe test</text>
    <text class="t sub" x="356" y="392">ou témoin est liée à un</text>
    <text class="t sub" x="356" y="410">événement politique</text>
  </g>

  <g>
    <rect x="644" y="322" width="292" height="106" rx="13" fill="#2f7d4f" fill-opacity="0.13" stroke="#2f7d4f" stroke-opacity="0.5"/>
    <text class="t box" x="666" y="350">De terrain</text>
    <text class="t sub" x="666" y="374">les tuteurs dans les écoles</text>
    <text class="t sub" x="666" y="392">primaires indiennes :</text>
    <text class="t sub" x="666" y="410">63 % en lecture, 70 % en maths</text>
  </g>
</svg>
