<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="Deux modeles de la creation de richesse, complet et simplifie">
  <title>Modèle 1 et modèle 2 — quand une hypothèse simplificatrice reste acceptable</title>
  <rect width="940" height="470" fill="#ffffff"/>

  <style>
    .t   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .ttl { font-size: 16px; font-weight: 700; }
    .ag  { font-size: 13px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: #46506b; }
    .ok  { font-size: 13.5px; font-weight: 700; fill: #2f7d4f; }
    .ko  { font-size: 13.5px; font-weight: 700; fill: #d92d5e; }
    .q   { font-size: 13.5px; font-weight: 700; fill: #12203f; }
  </style>

  <text class="t cap" x="30" y="38">§ II.1 · « comment est créée la richesse dans l'économie ? »</text>

  <defs>
    <marker id="fm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.4"/>
    </marker>
  </defs>

  <!-- modele 1 -->
  <rect x="30" y="60" width="430" height="300" rx="16" fill="#12203f" fill-opacity="0.04" stroke="#12203f" stroke-opacity="0.28"/>
  <text class="t ttl" x="54" y="94">Modèle 1 — très réaliste</text>
  <text class="t sub" x="54" y="116">tous les agents, et toutes leurs relations</text>

  <g stroke="#12203f" stroke-opacity="0.35" stroke-width="1.6" fill="none">
    <path d="M150 178 L 340 178 M150 262 L 340 262 M150 178 L 340 262 M340 178 L 150 262 M150 178 L 150 262 M340 178 L 340 262"/>
  </g>
  <g>
    <circle cx="150" cy="178" r="42" fill="#1f6f9c" fill-opacity="0.16" stroke="#1f6f9c" stroke-opacity="0.55"/>
    <text class="t ag" x="150" y="183" text-anchor="middle">État</text>
    <circle cx="340" cy="178" r="42" fill="#2f7d4f" fill-opacity="0.16" stroke="#2f7d4f" stroke-opacity="0.55"/>
    <text class="t ag" x="340" y="183" text-anchor="middle">Ménages</text>
    <circle cx="150" cy="262" r="42" fill="#c2761a" fill-opacity="0.16" stroke="#c2761a" stroke-opacity="0.55"/>
    <text class="t ag" x="150" y="267" text-anchor="middle">Entreprises</text>
    <circle cx="340" cy="262" r="46" fill="#12203f" fill-opacity="0.08" stroke="#12203f" stroke-opacity="0.4"/>
    <text class="t ag" x="340" y="260" text-anchor="middle">Reste du</text>
    <text class="t ag" x="340" y="277" text-anchor="middle">monde</text>
  </g>
  <text class="t sub" x="54" y="336">Complet, mais lourd : tout y est, même ce dont la question n'a pas besoin.</text>

  <!-- modele 2 -->
  <rect x="490" y="60" width="420" height="300" rx="16" fill="#12203f" fill-opacity="0.04" stroke="#12203f" stroke-opacity="0.28"/>
  <text class="t ttl" x="514" y="94">Modèle 2 — simplifié</text>
  <text class="t sub" x="514" y="116">ménages et entreprises, rien d'autre</text>

  <rect x="590" y="150" width="220" height="56" rx="12" fill="#2f7d4f" fill-opacity="0.16" stroke="#2f7d4f" stroke-opacity="0.55"/>
  <text class="t ag" x="700" y="184" text-anchor="middle">Ménages</text>
  <rect x="590" y="256" width="220" height="56" rx="12" fill="#c2761a" fill-opacity="0.16" stroke="#c2761a" stroke-opacity="0.55"/>
  <text class="t ag" x="700" y="290" text-anchor="middle">Entreprises</text>

  <g stroke="#12203f" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M640 210 v 40" marker-end="url(#fm)"/>
    <path d="M760 252 v -40" marker-end="url(#fm)"/>
  </g>
  <text class="t sub" x="514" y="336">≈ 80 % de la richesse : 55 % par les ménages, 25 % par les entreprises.</text>

  <!-- verdicts -->
  <rect x="30" y="380" width="430" height="66" rx="13" fill="#2f7d4f" fill-opacity="0.10" stroke="#2f7d4f" stroke-opacity="0.45"/>
  <text class="t q" x="54" y="406">Question : comment est créée la richesse ?</text>
  <text class="t ok" x="54" y="430">→ le modèle 2 suffit : hypothèses acceptables</text>

  <rect x="490" y="380" width="420" height="66" rx="13" fill="#d92d5e" fill-opacity="0.08" stroke="#d92d5e" stroke-opacity="0.45"/>
  <text class="t q" x="514" y="406">Question : quel est le rôle de l'État ?</text>
  <text class="t ko" x="514" y="430">→ pas d'État dans le modèle 2 : il faut le modèle 1</text>
</svg>
