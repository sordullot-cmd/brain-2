<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Source : slide « Matrice : la matrice BCG », Introduction à la gestion, partie 2 — capture collée dans les notes des deux camarades, 2026-2027 (©Christian Hohmann sur la slide). Mêmes axes, mêmes sens (part de marché forte à GAUCHE), mêmes quatre noms ; les dessins sont remplacés par les noms seuls. -->
  <rect width="760" height="520" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <g fill="#1f2937" text-anchor="middle">
    <text x="440" y="28" font-size="17" font-weight="700">Positionnement concurrentiel</text>
    <text x="440" y="50" font-size="17" font-weight="700">Parts de marché</text>
    <text x="300" y="86" font-size="20" font-weight="700">Fort</text>
    <text x="580" y="86" font-size="20" font-weight="700">faible</text>
    <text x="0" y="0" font-size="17" font-weight="700" transform="translate(40,300) rotate(-90)">Croissance du marché</text>
    <text x="110" y="210" font-size="20" font-weight="700">Forte</text>
    <text x="110" y="400" font-size="20" font-weight="700">faible</text>
  </g>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="170" y1="100" x2="720" y2="100" marker-start="url(#f)" marker-end="url(#f)"/>
    <line x1="150" y1="110" x2="150" y2="500" marker-start="url(#f)" marker-end="url(#f)"/>
  </g>
  <g stroke="#1f2937" stroke-width="3">
    <rect x="165" y="115" width="555" height="380" fill="none"/>
    <line x1="442" y1="115" x2="442" y2="495"/>
    <line x1="165" y1="305" x2="720" y2="305"/>
  </g>
  <rect x="167" y="117" width="273" height="186" fill="#fef3c7"/>
  <rect x="444" y="117" width="274" height="186" fill="#ede9fe"/>
  <rect x="167" y="307" width="273" height="186" fill="#dcfce7"/>
  <rect x="444" y="307" width="274" height="186" fill="#f3f4f6"/>
  <g fill="#1f2937" text-anchor="middle" font-size="24" font-weight="700">
    <text x="303" y="218">Stars</text>
    <text x="581" y="218">Dilemmes</text>
    <text x="303" y="408">Vaches à lait</text>
    <text x="581" y="408">Poids morts</text>
  </g>
</svg>
