<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
<!-- Reproduit la figure de la slide 30 des Seances 3-4 (Intro gestion, Carole Vigeant).
     Les trois etages emboites de la recherche. -->
<rect width="640" height="380" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Les trois étages de la recherche</text>
<rect x="60" y="54" width="520" height="250" rx="12" fill="#eef2f9" stroke="#2f4470" stroke-width="1.8"/>
<text x="80" y="80" font-size="13.5" font-weight="bold" fill="#24365c">Recherche &amp; développement</text>
<text x="80" y="98" font-size="11.5" fill="#3c4a68">s'appuie sur les découvertes pour chercher de nouvelles innovations</text>
<rect x="92" y="112" width="456" height="176" rx="10" fill="#dde6f4" stroke="#2f4470" stroke-width="1.6"/>
<text x="112" y="138" font-size="13.5" font-weight="bold" fill="#24365c">Recherche appliquée</text>
<text x="112" y="156" font-size="11.5" fill="#3c4a68">produit des inventions jusqu'au stade du prototype</text>
<rect x="124" y="172" width="392" height="100" rx="9" fill="#2f4470"/>
<text x="320" y="208" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Recherche fondamentale</text>
<text x="320" y="230" text-anchor="middle" font-size="11.5" fill="#d6dced">fait progresser la connaissance scientifique</text>
<text x="320" y="250" text-anchor="middle" font-size="11.5" fill="#d6dced">demande de lourds investissements</text>
<text x="320" y="340" text-anchor="middle" font-size="11.5" fill="#55607a">Slide 30 — du plus fondamental, au centre, au plus appliqué</text>
</svg>
