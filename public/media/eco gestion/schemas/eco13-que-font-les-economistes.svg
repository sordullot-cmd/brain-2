<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="Les trois activites des economistes et les trois critiques qui leur sont faites">
  <title>Prédire, comprendre, évaluer les politiques publiques — et les trois critiques</title>
  <rect width="960" height="452" fill="#ffffff"/>

  <style>
    .t   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .box { font-size: 15.5px; font-weight: 700; }
    .sub { font-size: 12px; fill: #46506b; }
    .key { font-size: 13.5px; font-weight: 700; fill: #12203f; }
    .note{ font-size: 12.5px; fill: #8a93a8; }
  </style>

  <text class="t cap" x="30" y="36">§ 1 · que font les économistes — trois activités complémentaires</text>

  <defs>
    <marker id="fe6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.45"/>
    </marker>
  </defs>

  <g>
    <rect x="24" y="70" width="292" height="130" rx="13" fill="#c2761a" fill-opacity="0.14" stroke="#c2761a" stroke-opacity="0.5"/>
    <text class="t box" x="46" y="100">1 · Prédire</text>
    <text class="t sub" x="46" y="126">croissance du PIB</text>
    <text class="t sub" x="46" y="146">taux de chômage</text>
    <text class="t sub" x="46" y="166">inflation</text>
    <text class="t note" x="46" y="188">(souvent fausse)</text>
  </g>

  <g>
    <rect x="334" y="70" width="292" height="130" rx="13" fill="#1f6f9c" fill-opacity="0.13" stroke="#1f6f9c" stroke-opacity="0.5"/>
    <text class="t box" x="356" y="100">2 · Comprendre</text>
    <text class="t sub" x="356" y="126">d'où viennent les crises</text>
    <text class="t sub" x="356" y="146">financières, l'inflation, la croissance</text>
    <text class="t sub" x="356" y="166">les décisions humaines, les arbitrages,</text>
    <text class="t sub" x="356" y="186">ce qui nous influence</text>
  </g>

  <g>
    <rect x="644" y="70" width="292" height="130" rx="13" fill="#2f7d4f" fill-opacity="0.13" stroke="#2f7d4f" stroke-opacity="0.5"/>
    <text class="t box" x="666" y="100">3 · Évaluer les politiques</text>
    <text class="t sub" x="666" y="126">hausse du SMIC</text>
    <text class="t sub" x="666" y="146">hausse ou baisse des impôts</text>
    <text class="t sub" x="666" y="166">réforme du lycée et réussite</text>
    <text class="t sub" x="666" y="186">pass Culture et pratiques</text>
  </g>

  <path d="M170 206 C 170 236, 480 226, 480 250" stroke="#12203f" stroke-opacity="0.35" stroke-width="2" fill="none"/>
  <path d="M480 206 v 44" stroke="#12203f" stroke-opacity="0.35" stroke-width="2" fill="none"/>
  <path d="M790 206 C 790 236, 480 226, 480 250" stroke="#12203f" stroke-opacity="0.35" stroke-width="2" fill="none" marker-end="url(#fe6)"/>

  <rect x="238" y="256" width="484" height="58" rx="13" fill="#12203f" fill-opacity="0.07" stroke="#12203f" stroke-opacity="0.35"/>
  <text class="t box" x="480" y="291" text-anchor="middle">Éclairer les décisions collectives</text>

  <text class="t key" x="30" y="356">Les critiques qui leur sont faites</text>

  <g>
    <rect x="24" y="370" width="292" height="58" rx="13" fill="#d92d5e" fill-opacity="0.07" stroke="#d92d5e" stroke-opacity="0.4"/>
    <text class="t key" x="46" y="394">Contradiction</text>
    <text class="t sub" x="46" y="414">chacun a son point de vue</text>
  </g>
  <g>
    <rect x="334" y="370" width="292" height="58" rx="13" fill="#d92d5e" fill-opacity="0.07" stroke="#d92d5e" stroke-opacity="0.4"/>
    <text class="t key" x="356" y="394">Prédictions erronées</text>
    <text class="t sub" x="356" y="414">cf. activité 1</text>
  </g>
  <g>
    <rect x="644" y="370" width="292" height="58" rx="13" fill="#d92d5e" fill-opacity="0.07" stroke="#d92d5e" stroke-opacity="0.4"/>
    <text class="t key" x="666" y="394">Idéologie plutôt que science</text>
    <text class="t sub" x="666" y="414">or les deux sont compatibles</text>
  </g>
</svg>
