<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="Le raisonnement hypothetico-deductif et ses quatre interets">
  <title>Hypothèses → modèle → prédiction, et les quatre intérêts du raisonnement</title>
  <rect width="960" height="390" fill="#ffffff"/>

  <style>
    .t   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .box { font-size: 16.5px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #46506b; }
    .key { font-size: 13.5px; font-weight: 700; }
    .note{ font-size: 12.5px; fill: #8a93a8; }
  </style>

  <text class="t cap" x="30" y="36">§ 1.3 rôle des hypothèses · raisonnement hypothético-déductif</text>

  <defs>
    <marker id="a18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.45"/>
    </marker>
  </defs>

  <g>
    <rect x="30" y="72" width="256" height="86" rx="13" fill="#c2761a" fill-opacity="0.14" stroke="#c2761a" stroke-opacity="0.5"/>
    <text class="t box" x="158" y="108" text-anchor="middle">Hypothèses</text>
    <text class="t sub" x="158" y="132" text-anchor="middle">ceteris paribus · rationalité · marché</text>
  </g>
  <path d="M292 115 h56" stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none" marker-end="url(#a18)"/>

  <g>
    <rect x="354" y="72" width="256" height="86" rx="13" fill="#2a5f9e" fill-opacity="0.14" stroke="#2a5f9e" stroke-opacity="0.5"/>
    <text class="t box" x="482" y="108" text-anchor="middle">Modèle</text>
    <text class="t sub" x="482" y="132" text-anchor="middle">représentation simplifiée du réel</text>
  </g>
  <path d="M616 115 h56" stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none" marker-end="url(#a18)"/>

  <g>
    <rect x="678" y="72" width="252" height="86" rx="13" fill="#2e7d5b" fill-opacity="0.14" stroke="#2e7d5b" stroke-opacity="0.5"/>
    <text class="t box" x="804" y="108" text-anchor="middle">Prédiction</text>
    <text class="t sub" x="804" y="132" text-anchor="middle">ce que le modèle annonce</text>
  </g>

  <text class="t cap" x="30" y="208">les quatre intérêts du raisonnement</text>

  <g>
    <rect x="30" y="226" width="216" height="92" rx="11" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <text class="t key" x="138" y="256" text-anchor="middle">Arbitrage</text>
    <text class="t sub" x="138" y="278" text-anchor="middle">parcimonie /</text>
    <text class="t sub" x="138" y="296" text-anchor="middle">pouvoir explicatif</text>
  </g>
  <g>
    <rect x="262" y="226" width="216" height="92" rx="11" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <text class="t key" x="370" y="256" text-anchor="middle">Incertitude</text>
    <text class="t sub" x="370" y="278" text-anchor="middle">elle est prise</text>
    <text class="t sub" x="370" y="296" text-anchor="middle">en compte</text>
  </g>
  <g>
    <rect x="494" y="226" width="216" height="92" rx="11" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <text class="t key" x="602" y="256" text-anchor="middle">Isoler les effets</text>
    <text class="t sub" x="602" y="278" text-anchor="middle">une cause à la fois</text>
  </g>
  <g>
    <rect x="726" y="226" width="204" height="92" rx="11" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <text class="t key" x="828" y="256" text-anchor="middle">Distinction</text>
    <text class="t sub" x="828" y="278" text-anchor="middle">individuel /</text>
    <text class="t sub" x="828" y="296" text-anchor="middle">global</text>
  </g>

  <text class="t note" x="30" y="356">Trois étapes en haut, quatre intérêts en bas : c'est la structure de tes notes, et elle se restitue telle quelle.</text>
</svg>
