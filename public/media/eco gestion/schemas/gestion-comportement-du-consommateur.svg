<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif">
<!-- Reproduit la figure de la slide 7 des Seances 3-4 (Intro gestion, Carole Vigeant).
     Les familles de facteurs qui pesent sur le processus d'achat. -->
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Le comportement du consommateur</text>
<g stroke="#5b6b8c" stroke-width="1.6">
<line x1="196" y1="108" x2="272" y2="176"/>
<line x1="444" y1="108" x2="368" y2="176"/>
<line x1="196" y1="300" x2="272" y2="236"/>
<line x1="444" y1="300" x2="368" y2="236"/>
<line x1="320" y1="330" x2="320" y2="254"/>
</g>
<ellipse cx="320" cy="206" rx="72" ry="42" fill="#2f4470"/>
<text x="320" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Processus</text>
<text x="320" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">d'achat</text>
<g font-size="12.5" fill="#1a1a1a" text-anchor="middle">
<rect x="38" y="62" width="160" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="118" y="84">Facteurs</text><text x="118" y="99">culturels</text>
<rect x="442" y="62" width="160" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="522" y="84">Facteurs</text><text x="522" y="99">sociaux</text>
<rect x="30" y="278" width="168" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="114" y="300">Variables</text><text x="114" y="315">individuelles</text>
<rect x="442" y="278" width="176" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="530" y="300">Variables</text><text x="530" y="315">environnementales</text>
<rect x="256" y="330" width="128" height="40" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="320" y="355">Stimuli</text>
</g>
</svg>
