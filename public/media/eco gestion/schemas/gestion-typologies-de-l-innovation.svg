<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif">
<!-- Reproduit la figure de la slide 27 des Seances 3-4 (Intro gestion, Carole Vigeant).
     Une innovation se qualifie sur deux axes : son intensite et son objet. -->
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Les deux axes de l'innovation</text>
<text x="320" y="70" text-anchor="middle" font-size="12.5" font-style="italic" fill="#55607a">Toute innovation se qualifie sur les deux à la fois</text>
<rect x="70" y="100" width="230" height="230" rx="10" fill="#f4f0e8" stroke="#8a6d3b" stroke-width="1.8"/>
<text x="185" y="128" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6b5428">L'INTENSITÉ</text>
<text x="185" y="146" text-anchor="middle" font-size="11.5" fill="#6b5428">à quel point ça change</text>
<rect x="92" y="164" width="186" height="66" rx="8" fill="#8c3a3a"/>
<text x="185" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Rupture</text>
<text x="185" y="212" text-anchor="middle" font-size="11" fill="#f0dcdc">change les usages</text>
<rect x="92" y="244" width="186" height="66" rx="8" fill="#2f6b46"/>
<text x="185" y="272" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Incrémentale</text>
<text x="185" y="292" text-anchor="middle" font-size="11" fill="#d8e8dd">améliore l'existant</text>
<text x="320" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#55607a">×</text>
<rect x="340" y="100" width="230" height="230" rx="10" fill="#eef2f9" stroke="#2f4470" stroke-width="1.8"/>
<text x="455" y="128" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#24365c">L'OBJET</text>
<text x="455" y="146" text-anchor="middle" font-size="11.5" fill="#24365c">ce qui change</text>
<rect x="362" y="164" width="186" height="66" rx="8" fill="#2f4470"/>
<text x="455" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Produit</text>
<text x="455" y="212" text-anchor="middle" font-size="11" fill="#d6dced">ce qu'on vend</text>
<rect x="362" y="244" width="186" height="66" rx="8" fill="#5a4b7a"/>
<text x="455" y="272" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Procédé</text>
<text x="455" y="292" text-anchor="middle" font-size="11" fill="#e0dbe9">la manière de produire</text>
<text x="320" y="366" text-anchor="middle" font-size="11.5" fill="#55607a">Slide 27 — l'iPhone : rupture (intensité) et produit (objet)</text>
</svg>
