<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Un meme effet peut avoir plusieurs causes simultanees, d ou toutes choses egales par ailleurs">
  <title>Causes multiples simultanées → « toutes choses égales par ailleurs »</title>
  <rect width="960" height="440" fill="#ffffff"/>

  <style>
    .t   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .box { font-size: 15.5px; font-weight: 700; }
    .sub { font-size: 12px; fill: #46506b; }
    .key { font-size: 13.5px; font-weight: 700; fill: #12203f; }
    .note{ font-size: 12.5px; fill: #8a93a8; }
  </style>

  <text class="t cap" x="30" y="36">§ 5 · la confrontation au réel — l'exemple de la consommation des ménages</text>

  <defs>
    <marker id="fe3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.45"/>
    </marker>
  </defs>

  <text class="t key" x="30" y="72">Cinq causes, un seul effet observé</text>

  <g>
    <rect x="24" y="86" width="264" height="34" rx="9" fill="#c2761a" fill-opacity="0.13" stroke="#c2761a" stroke-opacity="0.45"/>
    <text class="t sub" x="42" y="108">salaires (revenu du travail)</text>
  </g>
  <g>
    <rect x="24" y="128" width="264" height="34" rx="9" fill="#c2761a" fill-opacity="0.13" stroke="#c2761a" stroke-opacity="0.45"/>
    <text class="t sub" x="42" y="150">revenus du patrimoine</text>
  </g>
  <g>
    <rect x="24" y="170" width="264" height="34" rx="9" fill="#c2761a" fill-opacity="0.13" stroke="#c2761a" stroke-opacity="0.45"/>
    <text class="t sub" x="42" y="192">météo, pour certaines consommations</text>
  </g>
  <g>
    <rect x="24" y="212" width="264" height="34" rx="9" fill="#c2761a" fill-opacity="0.13" stroke="#c2761a" stroke-opacity="0.45"/>
    <text class="t sub" x="42" y="234">mesures de confinement</text>
  </g>
  <g>
    <rect x="24" y="254" width="264" height="34" rx="9" fill="#c2761a" fill-opacity="0.13" stroke="#c2761a" stroke-opacity="0.45"/>
    <text class="t sub" x="42" y="276">niveau des impôts sur le revenu</text>
  </g>

  <path d="M294 103 C 340 103, 340 187, 386 187" stroke="#12203f" stroke-opacity="0.35" stroke-width="1.8" fill="none"/>
  <path d="M294 145 C 340 145, 340 187, 386 187" stroke="#12203f" stroke-opacity="0.35" stroke-width="1.8" fill="none"/>
  <path d="M294 187 h 92" stroke="#12203f" stroke-opacity="0.35" stroke-width="1.8" fill="none"/>
  <path d="M294 229 C 340 229, 340 187, 386 187" stroke="#12203f" stroke-opacity="0.35" stroke-width="1.8" fill="none"/>
  <path d="M294 271 C 340 271, 340 187, 386 187" stroke="#12203f" stroke-opacity="0.35" stroke-width="1.8" fill="none"/>

  <g>
    <rect x="386" y="152" width="212" height="70" rx="13" fill="#1f6f9c" fill-opacity="0.13" stroke="#1f6f9c" stroke-opacity="0.5"/>
    <text class="t box" x="492" y="182" text-anchor="middle">Une variation de la</text>
    <text class="t box" x="492" y="202" text-anchor="middle">consommation</text>
  </g>

  <path d="M604 187 h 26" stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none" marker-end="url(#fe3)"/>

  <g>
    <rect x="632" y="128" width="304" height="118" rx="13" fill="#2f7d4f" fill-opacity="0.13" stroke="#2f7d4f" stroke-opacity="0.5"/>
    <text class="t box" x="656" y="158">Enjeu de la science éco</text>
    <text class="t sub" x="656" y="182">isoler l'effet de <tspan class="key">chaque</tspan> cause</text>
    <text class="t sub" x="656" y="200">sur la variation observée</text>
    <text class="t key" x="656" y="228">« Toutes choses égales par ailleurs »</text>
  </g>

  <rect x="24" y="316" width="452" height="94" rx="13" fill="#12203f" fill-opacity="0.06" stroke="#12203f" stroke-opacity="0.3"/>
  <text class="t key" x="46" y="344">Les causes se renforcent</text>
  <text class="t sub" x="46" y="368">chacune pousse l'effet dans le même sens :</text>
  <text class="t sub" x="46" y="386">l'effet observé est la somme des deux</text>

  <rect x="500" y="316" width="436" height="94" rx="13" fill="#d92d5e" fill-opacity="0.07" stroke="#d92d5e" stroke-opacity="0.4"/>
  <text class="t key" x="522" y="344">…ou elles s'annulent</text>
  <text class="t sub" x="522" y="368">elles se compensent partiellement entre elles :</text>
  <text class="t sub" x="522" y="386">on n'observe rien, alors que deux causes agissent</text>
</svg>
