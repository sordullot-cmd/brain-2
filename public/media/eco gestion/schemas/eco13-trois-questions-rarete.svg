<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Les trois questions de l economie et la rarete des ressources">
  <title>Quoi produire, à qui, comment — et le problème de la rareté</title>
  <rect width="960" height="420" fill="#ffffff"/>

  <style>
    .t   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .box { font-size: 15.5px; font-weight: 700; }
    .big { font-size: 22px; font-weight: 700; }
    .sub { font-size: 12px; fill: #46506b; }
    .key { font-size: 13.5px; font-weight: 700; fill: #12203f; }
    .note{ font-size: 12.5px; fill: #8a93a8; }
  </style>

  <text class="t cap" x="30" y="36">§ 2 · les trois questions, et le problème de la rareté</text>

  <defs>
    <marker id="fe2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.45"/>
    </marker>
  </defs>

  <g>
    <rect x="24" y="76" width="292" height="88" rx="13" fill="#1f6f9c" fill-opacity="0.13" stroke="#1f6f9c" stroke-opacity="0.5"/>
    <text class="t big" x="48" y="112">QUOI</text>
    <text class="t sub" x="48" y="136">produire, en termes de</text>
    <text class="t sub" x="48" y="153">biens et services</text>
  </g>

  <g>
    <rect x="334" y="76" width="292" height="88" rx="13" fill="#c2761a" fill-opacity="0.14" stroke="#c2761a" stroke-opacity="0.5"/>
    <text class="t big" x="358" y="112">À QUI</text>
    <text class="t sub" x="358" y="136">fournir les biens et</text>
    <text class="t sub" x="358" y="153">services produits</text>
  </g>

  <g>
    <rect x="644" y="76" width="292" height="88" rx="13" fill="#2f7d4f" fill-opacity="0.13" stroke="#2f7d4f" stroke-opacity="0.5"/>
    <text class="t big" x="668" y="112">COMMENT</text>
    <text class="t sub" x="668" y="136">quelles ressources utiliser,</text>
    <text class="t sub" x="668" y="153">comment les combiner</text>
  </g>

  <path d="M480 170 v 28" stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none" marker-end="url(#fe2)"/>

  <rect x="238" y="206" width="484" height="60" rx="13" fill="#d92d5e" fill-opacity="0.09" stroke="#d92d5e" stroke-opacity="0.45"/>
  <text class="t box" x="480" y="243" text-anchor="middle">Problème : les ressources sont souvent rares</text>

  <path d="M360 272 v 22" stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none" marker-end="url(#fe2)"/>
  <path d="M600 272 v 22" stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none" marker-end="url(#fe2)"/>

  <g>
    <rect x="120" y="302" width="336" height="82" rx="13" fill="#12203f" fill-opacity="0.06" stroke="#12203f" stroke-opacity="0.3"/>
    <text class="t key" x="144" y="330">Côté producteur</text>
    <text class="t sub" x="144" y="352">travail disponible · matières premières</text>
    <text class="t sub" x="144" y="370">biens non homogènes</text>
  </g>

  <g>
    <rect x="504" y="302" width="336" height="82" rx="13" fill="#12203f" fill-opacity="0.06" stroke="#12203f" stroke-opacity="0.3"/>
    <text class="t key" x="528" y="330">Côté consommateur</text>
    <text class="t sub" x="528" y="352">contrainte budgétaire</text>
  </g>
</svg>
