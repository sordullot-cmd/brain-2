<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Helvetica, Arial, sans-serif">
<!-- Reproduit la figure de la slide 3 du Chapitre 2 (PEC, Olivier Mouate).
     Les cinq fonctions d'integration sociale du travail. -->
<rect width="640" height="420" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">La fonction d'intégration sociale du travail</text>
<g stroke="#5b6b8c" stroke-width="1.6">
<line x1="320" y1="180" x2="320" y2="108"/>
<line x1="286" y1="196" x2="150" y2="150"/>
<line x1="354" y1="196" x2="490" y2="150"/>
<line x1="298" y1="228" x2="190" y2="318"/>
<line x1="342" y1="228" x2="450" y2="318"/>
</g>
<circle cx="320" cy="210" r="52" fill="#2f4470"/>
<text x="320" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Travail</text>
<g font-size="12.5" fill="#1a1a1a" text-anchor="middle">
<rect x="238" y="62" width="164" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="320" y="84">Instance</text><text x="320" y="99">de socialisation</text>
<rect x="34" y="118" width="150" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="109" y="140">Accès à des</text><text x="109" y="155">droits sociaux</text>
<rect x="456" y="118" width="150" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="531" y="140">Acquisition</text><text x="531" y="155">d'un revenu</text>
<rect x="46" y="306" width="150" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="121" y="328">Organisation</text><text x="121" y="343">du temps</text>
<rect x="444" y="306" width="158" height="46" rx="8" fill="#eef2f9" stroke="#5b6b8c" stroke-width="1.3"/>
<text x="523" y="328">Construction de</text><text x="523" y="343">l'identité sociale</text>
</g>
<text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#55607a">Slide 3 — le travail ne se réduit pas à un revenu</text>
</svg>
