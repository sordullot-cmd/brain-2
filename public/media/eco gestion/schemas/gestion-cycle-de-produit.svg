<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="Le cycle de vie d un produit en quatre etapes, avec pilotage transversal">
  <title>Le cycle de vie d'un produit — 4 étapes et leur pilotage transversal</title>
  <rect width="980" height="430" fill="#ffffff"/>

  <style>
    .t    { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #12203f; }
    .cap  { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; fill: #6b7690; }
    .num  { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .step { font-size: 18px; font-weight: 700; }
    .job  { font-size: 12.5px; fill: #46506b; }
    .pil  { font-size: 14px; font-weight: 700; fill: #12203f; }
    .note { font-size: 12px; fill: #8a93a8; }
  </style>

  <text class="t cap" x="30" y="38">Slides 16-17 · l'exemple du smartphone</text>

  <!-- 4 etapes -->
  <g>
    <rect x="30" y="60" width="205" height="190" rx="14" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <circle cx="58" cy="90" r="13" fill="#12203f"/><text class="t num" x="58" y="95" text-anchor="middle">1</text>
    <text class="t step" x="82" y="96">Concevoir</text>
    <text class="t job" x="52" y="128">R&amp;D / marketing</text>
    <text class="t job" x="52" y="150">bureau d'études</text>
    <text class="t job" x="52" y="172">méthodes</text>
    <text class="t job" x="52" y="194">implantations</text>
    <text class="t job" x="52" y="216">achats</text>
  </g>

  <g>
    <rect x="265" y="60" width="205" height="190" rx="14" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <circle cx="293" cy="90" r="13" fill="#12203f"/><text class="t num" x="293" y="95" text-anchor="middle">2</text>
    <text class="t step" x="317" y="96">Produire</text>
    <text class="t job" x="287" y="128">programmation / appros</text>
    <text class="t job" x="287" y="150">fabrication</text>
    <text class="t job" x="287" y="172">maintenance</text>
    <text class="t job" x="287" y="194">gestion des magasins</text>
    <text class="t job" x="287" y="216">qualité</text>
  </g>

  <g>
    <rect x="500" y="60" width="205" height="190" rx="14" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <circle cx="528" cy="90" r="13" fill="#12203f"/><text class="t num" x="528" y="95" text-anchor="middle">3</text>
    <text class="t step" x="552" y="96">Vendre</text>
    <text class="t job" x="522" y="128">communication</text>
    <text class="t job" x="522" y="150">vente</text>
    <text class="t job" x="522" y="172">réseau de distribution</text>
    <text class="t job" x="522" y="194">logistique</text>
    <text class="t job" x="522" y="216">après-vente</text>
  </g>

  <g>
    <rect x="735" y="60" width="215" height="190" rx="14" fill="#12203f" fill-opacity="0.05" stroke="#12203f" stroke-opacity="0.22"/>
    <circle cx="763" cy="90" r="13" fill="#12203f"/><text class="t num" x="763" y="95" text-anchor="middle">4</text>
    <text class="t step" x="787" y="96">Administrer</text>
    <text class="t job" x="757" y="128">recrutement · formation</text>
    <text class="t job" x="757" y="150">paie · juridique · audit</text>
    <text class="t job" x="757" y="172">comptabilité client</text>
    <text class="t job" x="757" y="194">et fournisseurs</text>
    <text class="t job" x="757" y="216">trésorerie · facturation</text>
  </g>

  <!-- fleches -->
  <g stroke="#12203f" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M241 155 h18" marker-end="url(#fl)"/>
    <path d="M476 155 h18" marker-end="url(#fl)"/>
    <path d="M711 155 h18" marker-end="url(#fl)"/>
  </g>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#12203f" fill-opacity="0.45"/>
    </marker>
  </defs>

  <!-- pilotage transversal -->
  <rect x="30" y="286" width="920" height="60" rx="14" fill="#2f7d4f" fill-opacity="0.12" stroke="#2f7d4f" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text class="t pil" x="490" y="322" text-anchor="middle">Pilotage transversal : direction générale · contrôle de gestion</text>

  <text class="t note" x="30" y="384">Le pilotage n'est pas une cinquième étape : il traverse les quatre. C'est le piège classique de la question de cours.</text>
  <text class="t note" x="30" y="406">Étape 1, la décision qui se pose : make or buy — concevoir puis fabriquer soi-même, ou faire fabriquer.</text>
</svg>
