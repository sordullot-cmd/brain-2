<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 686" width="1092" height="686"><rect width="1092" height="686" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">La seule couleur que Finch déclare, et les rôles nommés du site</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Finch ne publie ni press kit ni brand book. #72CAFC est le seul hex officiellement déclaré comme couleur de marque : il est à la fois theme_color et background_color du manifest.webmanifest. Le reste vient des noms de rôles écrits dans la feuille de style du site — leurs mots, pas les miens.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">COULEUR DE MARQUE DÉCLARÉE</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#72CAFC"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Bleu Finch</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#72CAFC</text><text x="46" y="224" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">theme_color et</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">background_color</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">du manifest</text><text x="28" y="318" font-family="'DIN Next Rounded','Nunito'