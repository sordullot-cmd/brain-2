<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 288" width="920" height="288"><rect width="920" height="288" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Les ratios d'usage — palette Care</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Headspace ne donne pas seulement des couleurs, il donne leur PROPORTION. C'est le detail le plus reutilisable de sa charte.</text><rect x="28" y="98" width="280" height="150" rx="16" fill="#FFCE00"/><text x="46" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Yellow 200 — 50 %</text><text x="46" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFCE00</text><text x="46" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">La moitie de la surface</text><rect x="320" y="98" width="280" height="150" rx="16" fill="#00A4FF"/><text x="338" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Blue 100 — 30 %</text><text x="338" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#00A4FF</text><text x="338" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">Le tiers restant</text><rect x="612" y="98" width="280" height="150" rx="16" fill="#FF7300"/><text x="630" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-si