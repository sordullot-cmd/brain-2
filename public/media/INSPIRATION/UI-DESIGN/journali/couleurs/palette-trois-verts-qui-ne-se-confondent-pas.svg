<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 524" width="830" height="524"><rect width="830" height="524" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Trois verts pour une seule marque</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Chacun vit dans une couche differente du produit, et rien ne les hierarchise. Le meme desaccord existe pour le rouge et pour l'ambre.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">LES VERTS</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#00D584"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">--green de la landing</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#00D584</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">le vert neon de la page d'accueil</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">halos, degrades de CTA</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#00D084"/><text x="308" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">--accent du press kit et des pages internes</text><text x="308" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17"