<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 524" width="1092" height="524"><rect width="1092" height="524" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Le seul produit de trading clair du corpus</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Releve de pixels sur les 10 fichiers d'UI de ecrans/ (creas photographiques du store exclues). Parts en pourcentage de la surface relevee.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">LES CLAIRS, 75,7 % - LA OU TOUS LES CONCURRENTS SONT SOMBRES</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Blanc pur</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFFFFF</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">35,11 %</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">reserve aux cartes et aux tables, pas au fond</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#ECEDEE"/><text x="308" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Gris de fond</text><text x="308" y="188" font-family="'DIN Next Rounded','Nunito','Avenir