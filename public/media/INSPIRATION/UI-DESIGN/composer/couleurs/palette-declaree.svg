<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 730" width="1092" height="730"><rect width="1092" height="730" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Les tokens lus dans le CSS de production</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">460 Ko dans un seul fichier, ou Tailwind compile s'empile sur une couche Webflow heritee. Aucune charte publiee : ces valeurs sont lues dans le code.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">NEUTRES - ET CE NE SONT NI DU BLANC NI DU NOIR</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#ECEDEE"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">.bg-grey-soft</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#ECEDEE</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">LE fond du site</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">17,95 % de la surface relevee. Le blanc pur est reserve aux cartes qui doivent flotter</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#101516"/><text x="308" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">.bg-dark / .bg-base-dark</text><text x="308" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#101516</text><text x="308" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">LE noir de marque, un vert-noir</text><text x="308" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">jamais #000 ; c'est le fond des panneaux de backtest</text><rect x="552" y="128" width="250" height="150" rx="16" fill="#F7F7F7" stroke="#E5E5E5" stroke-width="2"/><text x="570" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">.bg-soft-0</text><text x="570" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#F7F7F7</text><text x="570" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">fond de ligne de table</text><rect x="814" y="128" width="250" height="150" rx="16" fill="#BEC6CC"/><text x="832" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">.bg-soft-2 / .bg-grey</text><text x="832" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#BEC6CC</text><text x="832" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">gris bleute de separation, decline de 10 a 80 % d'opacite</text><text x="28" y="318" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">MARQUE</text><rec