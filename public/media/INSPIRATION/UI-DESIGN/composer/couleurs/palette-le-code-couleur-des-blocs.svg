<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1354 288" width="1354" height="288"><rect width="1354" height="288" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Une couleur par type de bloc - le vrai design system du produit</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Le code tient en trois couleurs et il est identique dans l'app, dans la doc et dans le marketing. Il survit meme a la traduction mobile.</text><rect x="28" y="98" width="250" height="150" rx="16" fill="#31805A"/><text x="46" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Weight (allocation)</text><text x="46" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#31805A</text><text x="46" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">pilule d'operateur</text><text x="46" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">WEIGHT Equal / Specified / Inverse Volatility / Market Cap</text><rect x="290" y="98" width="250" height="150" rx="16" fill="#1EC072"/><text x="308" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Poids explicite</text><text x="308" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#1EC072</text><text x="308" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">sous-pilule de valeur</text><text x="308" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">« 60.00 % », « 15 % » — un vert plus vif que l'operateur</text><rect x="552" y="98" width="250" height="150" rx="16" fill="#1F86FF"/><text x="570" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">If / Else (condition)</text><text x="570" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#1F86FF</text><text x="570" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">toute la logique conditionnelle</text><text x="570" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">la condition est ecrite en anglais, jamais en symboles</text><rect x="814" y="98" width="250" height="150" rx="16" fill="#F6609F"/><text x="832" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Filter (tri et selection)</text><text x="832" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#F6609F</text><text x="832" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">la paire SORT + SELECT Top N</text><text x="832" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">et les fleches vers chaque actif candidat</text><rect x="1076" y="98" width="250" height="150" rx="16" fill="#FFBB38"/><text x="1094" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Emplacement vide</text><text x="1094" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFBB38</text><text x="1094" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">« Add a Block - Securities, Weights, Conditions... »</text><text x="1094" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">l'ambre ne sert qu'a signaler le trou</text></svg>