<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 480" width="830" height="480"><rect width="830" height="480" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Palette declaree dans le code</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Ahead ne publie aucune charte ni aucun press kit. Les seules couleurs qu'il declare sont des valeurs de tokens lues dans les bundles du site : meta theme-color, ctaTextColor, MuiRating. Six valeurs en tout — le reste du bundle est la palette MUI par defaut.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">LES SIX SEULES VALEURS DECLAREES</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#6442EF"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">theme-color</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#6442EF</text><text x="46" y="224" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">violet primaire</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">meta theme-color du site</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">8 % de la surface des ecrans</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#4B27DC"/><text x="308" y="162" font-fa