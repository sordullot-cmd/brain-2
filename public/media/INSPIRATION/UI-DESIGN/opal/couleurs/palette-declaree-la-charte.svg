<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 524" width="1092" height="524"><rect width="1092" height="524" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">La charte declaree — quatre valeurs, et c'est tout</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Relevees dans le brand kit officiel brandkit.opal.so. Aucune couleur de marque : le noir EST la marque.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">LES QUATRE VALEURS DE BASE</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#000000"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Background</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#000000</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">Le noir PUR, pas un gris tres fonce</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">42,82 % de la surface relevee</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="308" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Main Text</text><text x="308" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFFFFF</text><text x="308" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">Texte principal</text><text x="308" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">releve a #F8F8F8, 5,80 %</text><rect x="552" y="128" width="250" height="150" rx="16" fill="#BCBBC0"/><text x="570" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Secondary</text><text x="570" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#BCBBC0</text><text x="570" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">Texte secondaire</text><text x="570" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">un gris legerement violace</text><rect x="814" y="128" width="250" height="150" rx="16" fill="#3A3A3A"/><text x="832" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Surfaces</text><text x="832" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#3A3A3A</text><text x="832" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">La seule surface au-dessus du fond</text><text x="832" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">releve a #303030, 5,42 %</text><text x="28" y="318" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">LE DEGRADE DE TEXTE — LE SEUL DEGRADE HORS APP</text><rect x="28" y="334" width="250" height="150" rx="16" fill="#BCBBC0"/><text x="46" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Text Gradient (debut)</text><text x="46" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#BCBBC0</text><text x="46" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">= Secondary</text><rect x="290" y="334" width="250" height="150" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="308" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Text Gradient (fin)</text><text x="308" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFFFFF</text><text x="308" y="449" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">= Main Text</text><text x="308" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">un titre qui s'eclaircit vers le haut</text></svg>