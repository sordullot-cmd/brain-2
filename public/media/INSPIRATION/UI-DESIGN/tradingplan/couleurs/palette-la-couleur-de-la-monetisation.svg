<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 288" width="830" height="288"><rect width="830" height="288" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">L'ambre, seconde couleur du systeme, entierement dediee au PRO</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Non tokenisee dans le CSS, mais employee cinq fois, et jamais pour autre chose que l'abonnement ou la preuve sociale.</text><rect x="28" y="98" width="250" height="150" rx="16" fill="#FBBF24"/><text x="46" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Ambre PRO</text><text x="46" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FBBF24</text><text x="46" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">couronne, cadenas, badge de palier, chip PRO, etoiles d'avis</text><text x="46" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">toujours double d'un fond en rgba a 4-35 %</text><rect x="290" y="98" width="250" height="150" rx="16" fill="#F5B14A"/><text x="308" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">Ambre des etoiles du hero</text><text x="308" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#F5B14A</text><text x="308" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">une seule occurrence, plus orangee</text><text x="308" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">les cinq etoiles sous le CTA</text><rect x="552" y="98" width="250" height="150" rx="16" fill="#8B1A1A"/><text x="570" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Rouge du bloc « ce que ce n'est pas »</text><text x="570" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#8B1A1A</text><text x="570" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">une seule occurrence</text><text x="570" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">filet gauche de 3 px du bloc qui dit ce que le produit ne fait PAS</text></svg>