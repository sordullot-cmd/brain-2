<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 524" width="830" height="524"><rect width="830" height="524" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Le site ne rend pas ce que le press kit publie</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Un second bloc :root en fin de feuille, commente « V3 VISUAL ENHANCEMENTS - MAKE IT POP », redefinit trois tokens de surface. C'est la seconde definition qui gagne.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">CE QUE LE PRESS KIT DECLARE - ET CE QUE L'APP REND</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#111418"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Surface</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#111418</text><text x="46" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">valeur publiee</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">26,61 % de la surface des ecrans releves : l'app, elle, l'utilise bien</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#1A1F26"/><text x="308" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Surface 2</text><text x="308" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#1A1F26</text><text x="308" y="243" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">valeur publiee</text><text x="308" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">2,38 % au releve</text><rect x="552" y="128" width="250" height="150" rx="16" fill="#232930"/><text x="570" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Border</text><text x="570" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#232930</text><text x="570" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">valeur d'origine de la feuille</text><text x="28" y="318" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">CE QUE LE SITE REND EN PRODUCTION</text><rect x="28" y="334" width="250" height="150" rx="16" fill="#13171D"/><text x="46" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Surface (V3)</text><text x="46" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#13171D</text><text x="46" y="449" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">redefinie ligne 1925</text><text x="46" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">plus claire et plus bleutee</text><rect x="290" y="334" width="250" height="150" rx="16" fill="#1C2230"/><text x="308" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Surface 2 (V3)</text><text x="308" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#1C2230</text><text x="308" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">redefinie ligne 1926</text><rect x="552" y="334" width="250" height="150" rx="16" fill="#2D3744"/><text x="570" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Border (V3)</text><text x="570" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#2D3744</text><text x="570" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">commentaire du code : « Brighter borders so cards read against the background »</text></svg>