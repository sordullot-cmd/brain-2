<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1354 494" width="1354" height="494"><rect width="1354" height="494" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Ce que l'app fait de la couleur : 7,5 % en tout</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Releve sur les 11 fichiers de ecrans/. Le violet est l'accent de marque, le vert et le rouge sont semantiques, et l'ambre est reserve a l'avertissement.</text><rect x="28" y="98" width="250" height="150" rx="16" fill="#8B5CF6"/><text x="46" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">violet d'accent</text><text x="46" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#8B5CF6</text><text x="46" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">1,13 % pour toute la famille violette</text><text x="46" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">boutons, etats actifs, barres de score, chips d'information</text><rect x="290" y="98" width="250" height="150" rx="16" fill="#6D56F8"/><text x="308" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">violet de degrade</text><text x="308" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#6D56F8</text><text x="308" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">la variante bleutee, presente dans les degrades de CTA</text><rect x="552" y="98" width="250" height="150" rx="16" fill="#0AB57D"/><text x="570" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">vert de reussite</text><text x="570" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#0AB57D</text><text x="570" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">0,66 % pour toute la famille verte</text><text x="570" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">gain, regle tenue, bouton Trade deverrouille</text><rect x="814" y="98" width="250" height="150" rx="16" fill="#F26A6A"/><text x="832" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">rouge de faute</text><text x="832" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#F26A6A</text><text x="832" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">0,40 %</text><text x="832" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">perte, bandeau « Max loss hit »</text><rect x="1076" y="98" width="250" height="150" rx="16" fill="#E49909"/><text x="1094" y="132" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">ambre d'avertissement</text><text x="1094" y="158" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#E49909</text><text x="1094" y="213" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">0,05 % seulement</text><text x="1094" y="232" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">« Trade placed outside your allowed hours » - le cran entre le vert et le rouge</text><text x="28" y="288" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">ET LA SEULE COULEUR CHAUDE DE TOUTE LA CHARTE</text><rect x="28" y="304" width="250" height="150" rx="16" fill="#F0A078"/><text x="46" y="338" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">degrade de « Trade Anyway »</text><text x="46" y="364" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#F0A078</text><text x="46" y="419" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">orange vers rouge</text><text x="46" y="438" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">la marque reserve sa couleur la plus agressive a l'action qu'elle desapprouve</text><rect x="290" y="304" width="250" height="150" rx="16" fill="#FFA0BE"/><text x="308" y="338" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">rose d'alerte</text><text x="308" y="364" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFA0BE</text><text x="308" y="419" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">stroke des icones d'alerte</text><text x="308" y="438" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">deux valeurs voisines coexistent, #ff9fbd en CSS et #ffa0be en SVG</text><rect x="552" y="304" width="250" height="150" rx="16" fill="#DC2626"/><text x="570" y="338" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">rouge d'infraction</text><text x="570" y="364" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#DC2626</text><text x="570" y="438" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">stroke SVG des icones de violation, 13 occurrences</text><rect x="814" y="304" width="250" height="150" rx="16" fill="#7C5CFC"/><text x="832" y="338" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">violet de coche</text><text x="832" y="364" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#7C5CFC</text><text x="832" y="438" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">stroke des icones de validation, sur pastille #f3f0ff</text><rect x="1076" y="304" width="250" height="150" rx="16" fill="#4C6971"/><text x="1094" y="338" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">bleu-gris des charts</text><text x="1094" y="364" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#4C6971</text><text x="1094" y="419" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">1,98 %</text><text x="1094" y="438" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">le fond des zones de graphique, la plus grosse couleur non neutre du releve</text></svg>