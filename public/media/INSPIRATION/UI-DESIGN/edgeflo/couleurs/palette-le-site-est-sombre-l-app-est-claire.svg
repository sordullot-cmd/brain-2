 Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FAFAFA</text><text x="46" y="449" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">56,21 % a lui seul</text><text x="46" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">un blanc casse, pas du blanc pur</text><rect x="290" y="334" width="250" height="150" rx="16" fill="#F1F1F7" stroke="#E5E5E5" stroke-width="2"/><text x="308" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">surface lavande</text><text x="308" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#F1F1F7</text><text x="308" y="449" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">9,37 %</text><text x="308" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">les cartes prennent une teinte violette tres pale</text><rect x="552" y="334" width="250" height="150" rx="16" fill="#E7E6E8"/><text x="570" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">bordure</text><text x="570" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#E7E6E8</text><text x="570" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">4,85 %</text><rect x="814" y="334" width="250" height="150" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><text x="832" y="368" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#4B4B4B">blanc pur</text><text x="832" y="394" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#4B4B4B" opacity="0.92">#FFFFFF</text><text x="832" y="449" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">2,72 % seulement</text><text x="832" y="468" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4B4B4B" opacity="0.8">reserve aux surfaces qui doivent flotter</text></svg>