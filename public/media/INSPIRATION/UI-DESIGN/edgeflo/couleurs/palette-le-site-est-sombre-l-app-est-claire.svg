<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 524" width="1092" height="524"><rect width="1092" height="524" fill="#FFFFFF"/><text x="28" y="58" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#4B4B4B">Deux directions artistiques pour un seul produit</text><text x="28" y="84" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#777777">Le site marketing est integralement sombre. L'app, elle, est claire a 88,6 % au releve de pixels. Et un bouton « Light Theme » dans le rail prouve qu'un mode sombre existe cote app - mais aucune capture n'en est publiee.</text><text x="28" y="112" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#777777">LE SITE MARKETING - TOKENS FRAMER LUS DANS LE CSS</text><rect x="28" y="128" width="250" height="150" rx="16" fill="#16151A"/><text x="46" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">encre principale</text><text x="46" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#16151A</text><text x="46" y="262" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">couleur de texte et de lien par defaut du site</text><rect x="290" y="128" width="250" height="150" rx="16" fill="#845EED"/><text x="308" y="162" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">violet de marque</text><text x="308" y="188" font-family="'DIN Next Rounded','Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" opacity="0.92">#845EED</text><text x="308"